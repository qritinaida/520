<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>กล่องของขวัญ 🎁</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ec; --bg2:#ffd0e0; --box:#ff8fb1; --box-d:#f2749d;
  --ribbon:#fff3a8; --ink:#7a2e4d; --card:#fffafc;
}
@media (prefers-color-scheme: dark){
  :root{ --bg1:#3a1727; --bg2:#2a0f1c; --card:#4a2034; --ink:#ffd9e6; }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:'Mali','Sarabun',system-ui,sans-serif;
  color:var(--ink);
  background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;text-align:center;padding:16px;
}
h1{font-size:clamp(1.3rem,5vw,1.9rem);margin:0 0 4px}
p.hint{margin:0 0 28px;opacity:.75}

/* กล่องของขวัญ */
.gift{position:relative;width:180px;height:180px;cursor:pointer;border:0;background:none;padding:0;
  animation:wiggle 2.4s ease-in-out infinite;transform-origin:50% 100%}
.gift:focus-visible{outline:3px dashed var(--ink);outline-offset:8px;border-radius:12px}
.body{position:absolute;bottom:0;left:10px;width:160px;height:120px;background:var(--box);
  border-radius:0 0 14px 14px;box-shadow:inset -14px 0 0 var(--box-d)}
.body::before{content:"";position:absolute;left:68px;top:0;width:24px;height:100%;background:var(--ribbon)}
.lid{position:absolute;top:32px;left:0;width:180px;height:38px;background:var(--box);
  border-radius:12px;box-shadow:inset -14px 0 0 var(--box-d);
  transition:transform .6s cubic-bezier(.3,1.6,.5,1);z-index:2}
.lid::before{content:"";position:absolute;left:78px;top:0;width:24px;height:100%;background:var(--ribbon)}
.lid::after{content:"🎀";position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:44px}
.gift.open{animation:none}
.gift.open .lid{transform:translate(70px,-90px) rotate(28deg)}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-3deg)}}

/* การ์ดข้อความ */
.card{position:absolute;left:50%;top:50%;width:min(320px,86vw);background:var(--card);
  border-radius:24px;padding:22px 20px;box-shadow:0 12px 30px rgba(200,70,120,.25);
  transform:translate(-50%,-30%) scale(.3);opacity:0;pointer-events:none;z-index:5;
  transition:transform .6s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.card.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.card .emoji{font-size:54px;display:block}
.card h2{margin:6px 0;font-size:1.3rem}
.card p{margin:0 0 14px;line-height:1.6}
.btn{font:inherit;font-weight:700;background:var(--box);color:#fff;border:0;border-radius:999px;
  padding:10px 22px;cursor:pointer}
.btn:hover{background:var(--box-d)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.heart{position:fixed;bottom:-40px;pointer-events:none;z-index:10;
  animation:rise var(--d) ease-out forwards}
@keyframes rise{
  0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}
  100%{transform:translate(var(--x),-110vh) scale(1.2) rotate(var(--r));opacity:0}
}
@media (prefers-reduced-motion:reduce){.gift{animation:none}.heart{animation-duration:2s}}
</style>
</head>
<body>
  <h1>มีของขวัญมาให้เธอ 💝</h1>
  <p class="hint" id="hint">แตะกล่องเพื่อเปิดเลย</p>

  <button class="gift" id="gift" aria-label="เปิดกล่องของขวัญ">
    <div class="lid"></div>
    <div class="body"></div>
  </button>

  <div class="card" id="card" role="dialog" aria-live="polite">
    <span class="emoji" id="emoji">🧸</span>
    <h2 id="title"></h2>
    <p id="msg"></p>
    <button class="btn" id="again">ปิดกล่อง แล้วเปิดใหม่ 🎁</button>
  </div>

<script>
// ✏️ แก้ข้อความของขวัญตรงนี้ได้เลย
const GIFTS = [
  {e:"🧸", t:"ตุ๊กตาหมีกอดแน่นๆ", m:"ขอกอดวันนี้ให้หายเหนื่อยนะ"},
  {e:"🍰", t:"เค้กชิ้นโปรด", m:"กินให้อิ่มแล้วยิ้มเยอะๆ นะ"},
  {e:"🌸", t:"ช่อดอกไม้ให้เธอ", m:"เธอน่ารักที่สุดเลย รู้ยัง?"},
  {e:"💌", t:"จดหมายรัก", m:"ขอบคุณที่อยู่ข้างกันเสมอนะ"},
  {e:"🍫", t:"ช็อกโกแลตหวานๆ", m:"หวานเหมือนรอยยิ้มเธอเลย"}
];
const HEARTS = ["💖","💗","💕","💝","🩷","💘"];

const gift = document.getElementById("gift");
const card = document.getElementById("card");
const hint = document.getElementById("hint");
let n = 0, isOpen = false;

function burst(count = 26){
  for(let i = 0; i < count; i++){
    const h = document.createElement("span");
    h.className = "heart";
    h.textContent = HEARTS[Math.floor(Math.random()*HEARTS.length)];
    h.style.left = (20 + Math.random()*60) + "vw";
    h.style.fontSize = (18 + Math.random()*26) + "px";
    h.style.setProperty("--x", (Math.random()*160 - 80) + "px");
    h.style.setProperty("--r", (Math.random()*80 - 40) + "deg");
    h.style.setProperty("--d", (2.2 + Math.random()*1.8) + "s");
    h.style.animationDelay = (Math.random()*0.6) + "s";
    document.body.appendChild(h);
    h.addEventListener("animationend", () => h.remove());
  }
}

function openGift(){
  if(isOpen) return;
  isOpen = true;
  const g = GIFTS[n++ % GIFTS.length];
  document.getElementById("emoji").textContent = g.e;
  document.getElementById("title").textContent = g.t;
  document.getElementById("msg").textContent = g.m;
  gift.classList.add("open");
  hint.style.visibility = "hidden";
  burst();
  setTimeout(() => card.classList.add("show"), 350);
}

function reset(){
  card.classList.remove("show");
  gift.classList.remove("open");
  hint.style.visibility = "visible";
  isOpen = false;
}

gift.addEventListener("click", openGift);
document.getElementById("again").addEventListener("click", reset);
card.addEventListener("click", e => { if(e.target === card) burst(10); });
</script>
</body>
</html>
